context:
  name: sdt-python
  version: "20.2.0"
  hash: "130b2d4da113b0bc9e94051f99e74f3ae386f0cefcf65a8c2f3cc2480f545818"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://codeberg.org/boku-bphy/${{ name }}/releases/download/${{ version }}/${{ name | replace("-", "_") }}-${{ version }}.tar.gz
  sha256: ${{ hash }}

build:
  number: 0
  script: "${{ PYTHON }} -m pip install . --no-deps -vv"
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy >=2.1
    - pandas >=2.2.3
    - pytables >=3.10
    - opencv
    - pyyaml
    - imageio >=2.29
    - numba
    - pyside6 >=6.10.2
    - matplotlib-base
    - scipy >0.18
    - tifffile >=2022.2.2
    - lazy_loader

tests:
  - script:
      - pytest -v --ignore tests/test_multicolor.py --ignore=tests/test_gui/ tests # ignore GUI tests since they segfault on Linux
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - trackpy
        - lmfit
        - scikit-learn
        - pims
        - pywavelets >=0.3.0
    files:
      source:
        - tests/  # trailing slash seems necessary to copy directory
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - sdt
        - sdt.brightness
        - sdt.changepoint
        - sdt.flatfield
        - sdt.fret
        - sdt.helper
        - sdt.image
        - sdt.io
        - sdt.loc
        - sdt.motion
        - sdt.multicolor
        - sdt.optimize
        - sdt.roi
        - sdt.sim
        - sdt.spatial

about:
  homepage: https://codeberg.org/boku-bphy/sdt-python
  license: BSD-3-Clause
  license_file:
    - LICENSES/BSD-3-Clause.txt
    - LICENSES/CC-BY-4.0.txt
    - LICENSES/CC0-1.0.txt
    - LICENSES/MIT.txt
    - sdt/gui/breeze-icons/COPYING-ICONS
  summary: "Tools for fluorescence microscopy data analysis"
  repository: https://codeberg.org/boku-bphy/sdt-python
  documentation: https://boku-bphy.codeberg.page/sdt-python

extra:
  recipe-maintainers:
    - lschr
